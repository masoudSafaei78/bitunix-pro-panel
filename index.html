<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bitunix Pro Panel V2</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;padding:22px;background:#0b0f10;color:#e9efef;font-family:system-ui}.wrap{max-width:1280px;margin:auto}.top{display:flex;gap:12px;justify-content:space-between;flex-wrap:wrap}.search{position:relative;min-width:300px}.search input{width:100%;padding:12px;border-radius:10px;border:1px solid #293436;background:#12191a;color:#fff}.suggest{position:absolute;top:46px;inset-inline:0;background:#12191a;border:1px solid #293436;display:none;z-index:20}.suggest.open{display:block}.s{padding:9px;cursor:pointer}.muted{color:#91a0a0}.pos{color:#3ddc97}.neg{color:#ff7c86}.warn{color:#f0c36a}.danger{color:#ff6672;font-weight:700}button{padding:9px 12px;border:0;border-radius:9px;cursor:pointer}table{width:100%;border-collapse:collapse;margin-top:18px;background:#111718}th,td{padding:10px;border-bottom:1px solid #253032;text-align:right}tr{cursor:pointer}.box{margin-top:14px;padding:12px;background:#12191a;border:1px solid #293436;border-radius:12px}.modalbg{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:15px;z-index:100}.modalbg.open{display:flex}.modal{width:min(1000px,100%);max-height:92vh;overflow:auto;background:#111718;border-radius:16px}.head{display:flex;justify-content:space-between;padding:14px;border-bottom:1px solid #293436;position:sticky;top:0;background:#111718;z-index:3}.body{padding:15px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.card{padding:11px;background:#151d1e;border:1px solid #253032;border-radius:10px}.k{font-size:12px;color:#91a0a0}.tfbar{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0}.tf.active{background:#e1e8e8;color:#111}.chartbox{margin-top:12px;padding:12px;background:#151d1e;border-radius:12px}canvas{width:100%;background:#0d1314;border-radius:8px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.analysis{margin-top:12px;padding:12px;background:#101617;border:1px solid #263234;border-radius:10px;line-height:1.8}.sectionTitle{margin-top:12px;margin-bottom:6px}.debug{font-size:11px;color:#738181;margin-top:7px}@media(max-width:700px){body{padding:10px}.grid,.stats{grid-template-columns:1fr}table{display:block;overflow:auto;white-space:nowrap}}
</style>
</head>
<body>
<div class="wrap"><div class="top"><div><h2>Bitunix Pro Panel V2</h2><div class="muted">Top 5 Futures + Funding Risk + Volume + RSI</div></div><div class="search"><input id="q" placeholder="مثلاً BTC یا AKE"><div id="suggest" class="suggest"></div></div><button id="refreshBtn">بروزرسانی</button></div><div id="top">در حال دریافت...</div><div id="candidates" class="box"></div></div>
<div id="modalbg" class="modalbg"><div class="modal"><div class="head"><b id="title">جزئیات</b><button id="closeBtn">×</button></div><div id="body" class="body"></div></div></div>
<script>
let symbols=[],active='',tf='5m',candles=[];
const E=id=>document.getElementById(id);
const pct=x=>x==null||!Number.isFinite(Number(x))?'—':(Number(x)>=0?'+':'')+Number(x).toFixed(2)+'%';
const num=(x,d=8)=>x==null||!Number.isFinite(Number(x))?'—':Number(x).toLocaleString('en-US',{maximumFractionDigits:d});
const compact=x=>x==null||!Number.isFinite(Number(x))?'—':Number(x).toLocaleString('en-US',{notation:'compact',maximumFractionDigits:2});
const fund=x=>x==null?'—':num(x,8)+'%';
const card=(k,v,c='')=>'<div class="card"><div class="k">'+k+'</div><div class="'+c+'">'+v+'</div></div>';
const avg=a=>a.length?a.reduce((s,x)=>s+x,0)/a.length:null;
const volOf=x=>{for(const v of [x.volume,x.quoteVolume,x.quoteVol,x.baseVolume,x.baseVol]){const n=Number(v);if(Number.isFinite(n)&&n>=0)return n}return null};
const completed=()=>{if(!candles.length)return[];const explicit=candles.filter(x=>x.isClosed===true);if(explicit.length>=Math.max(1,candles.length-2))return explicit;return candles.slice(0,-1)};
function calcRSI(a,p=14){const o=Array(a.length).fill(null);if(a.length<=p)return o;let g=0,l=0;for(let i=1;i<=p;i++){const d=a[i]-a[i-1];d>=0?g+=d:l-=d}let ag=g/p,al=l/p;o[p]=al===0?100:100-100/(1+ag/al);for(let i=p+1;i<a.length;i++){const d=a[i]-a[i-1],gg=d>0?d:0,ll=d<0?-d:0;ag=(ag*(p-1)+gg)/p;al=(al*(p-1)+ll)/p;o[i]=al===0?100:100-100/(1+ag/al)}return o}
async function init(){try{const r=await fetch('/api/symbols?t='+Date.now()),j=await r.json();symbols=j.symbols||[]}catch(e){console.error(e)}}
E('q').addEventListener('input',()=>{const s=E('q').value.trim().toUpperCase(),m=symbols.filter(x=>x.symbol.includes(s)).slice(0,12);E('suggest').innerHTML=m.map(x=>'<div class="s" data-s="'+x.symbol+'"><b>'+x.symbol+'</b> '+pct(x.change24hPct)+'</div>').join('');E('suggest').classList.toggle('open',!!s&&m.length>0);E('suggest').querySelectorAll('.s').forEach(el=>el.onclick=()=>openSymbol(el.dataset.s))});
E('refreshBtn').onclick=loadTop;E('closeBtn').onclick=closeModal;E('modalbg').onclick=e=>{if(e.target===E('modalbg'))closeModal()};
async function loadTop(){E('top').textContent='در حال دریافت...';try{const r=await fetch('/api/scan?t='+Date.now()),j=await r.json();if(!r.ok)throw new Error(j.error||'scan');E('top').innerHTML='<table><thead><tr><th>#</th><th>Symbol</th><th>24h</th><th>Price</th><th>Volume</th><th>Funding</th><th>Interval</th><th>ریسک</th></tr></thead><tbody>'+j.top5.map((x,i)=>'<tr data-s="'+x.symbol+'"><td>'+(i+1)+'</td><td><b>'+x.symbol+'</b></td><td class="'+(x.change24hPct>=0?'pos':'neg')+'">'+pct(x.change24hPct)+'</td><td>'+num(x.lastPrice)+'</td><td>'+compact(x.quoteVol24h)+'</td><td>'+fund(x.fundingRate)+'</td><td>'+(x.fundingIntervalHours==null?'—':num(x.fundingIntervalHours,2)+'h')+'</td><td class="'+(x.fundingRiskLevel==='extreme'?'danger':x.fundingRiskLevel==='high'||x.fundingRiskLevel==='very-high'?'warn':'')+'">'+x.fundingRisk+'</td></tr>').join('')+'</tbody></table>';E('top').querySelectorAll('tr[data-s]').forEach(tr=>tr.onclick=()=>openSymbol(tr.dataset.s));E('candidates').innerHTML='<b>کاندیدهای بررسی بیشتر:</b> '+(j.candidates?.length?j.candidates.map(x=>x.symbol).join('، '):'مورد مناسبی نیست')}catch(e){E('top').innerHTML='<span class="neg">خطا در دریافت داده: '+e.message+'</span>'}}
async function openSymbol(s){active=s;E('suggest').classList.remove('open');E('modalbg').classList.add('open');E('title').textContent=s;E('body').textContent='در حال دریافت...';try{const r=await fetch('/api/detail?symbol='+encodeURIComponent(s)+'&t='+Date.now()),x=await r.json();if(!r.ok)throw new Error(x.error||'detail');const dh=x.high24h?((x.lastPrice-x.high24h)/x.high24h)*100:null;E('body').innerHTML='<div class="grid">'+card('24h',pct(x.change24hPct),x.change24hPct>=0?'pos':'neg')+card('Price',num(x.lastPrice))+card('24h Volume',compact(x.quoteVol24h))+card('Funding',fund(x.fundingRate))+card('Funding Interval',x.fundingIntervalHours==null?'—':num(x.fundingIntervalHours,2)+'h')+card('30-day filter',x.eligible30d?'✅ Passed':'❌ Failed')+card('24h High',num(x.high24h))+card('Distance from 24h High',pct(dh))+card('ATH Bitunix Futures',num(x.athBitunixFutures))+card('Distance from ATH',pct(x.distanceFromAthPct))+'</div><div class="chartbox"><div class="tfbar" id="tfbar">'+['1m','5m','15m','1h','4h','1d','1w','1M'].map(z=>'<button class="tf '+(z===tf?'active':'')+'" data-tf="'+z+'">'+z+'</button>').join('')+'</div><div class="sectionTitle muted">Price</div><canvas id="priceChart" width="900" height="180"></canvas><div class="sectionTitle muted">Volume per candle</div><canvas id="volChart" width="900" height="120"></canvas><div id="volStats" class="stats"></div><div class="sectionTitle muted">RSI(14) — Live / Last Closed</div><canvas id="rsiChart" width="900" height="120"></canvas><div id="rsiStats" class="stats"></div><div id="analysisBox" class="analysis">در حال تحلیل...</div><div id="debugBox" class="debug"></div></div>';E('tfbar').querySelectorAll('.tf').forEach(b=>b.onclick=()=>{tf=b.dataset.tf;E('tfbar').querySelectorAll('.tf').forEach(x=>x.classList.toggle('active',x.dataset.tf===tf));loadKline()});await loadKline()}catch(e){E('body').innerHTML='<span class="neg">خطا: '+e.message+'</span>'}}
async function loadKline(){const a=E('analysisBox'),d=E('debugBox');try{const r=await fetch('/api/kline?symbol='+encodeURIComponent(active)+'&interval='+tf+'&limit=120&t='+Date.now());const j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||'kline');candles=Array.isArray(j.candles)?j.candles:[];if(candles.length<2)throw new Error('کندل کافی دریافت نشد');if(d)d.textContent='Kline: '+candles.length+' candles | Volume valid: '+(j.volumeDiagnostics?.validVolumeCount??candles.filter(x=>volOf(x)!=null).length);drawPrice();drawVolume();const rsis=calcRSI(candles.map(x=>Number(x.close)));drawRSI(rsis);analyze(rsis)}catch(e){if(a)a.innerHTML='<span class="neg">خطا در دریافت کندل/حجم: '+e.message+'</span>';if(d)d.textContent='';console.error(e)}}
function drawPrice(){const c=E('priceChart');if(!c)return;const v=candles.map(x=>Number(x.close)).filter(Number.isFinite);if(v.length<2)return;const ctx=c.getContext('2d'),mi=Math.min(...v),ma=Math.max(...v),sp=ma-mi||1;ctx.clearRect(0,0,c.width,c.height);ctx.beginPath();v.forEach((z,i)=>{const x=i*c.width/(v.length-1),y=c.height-(z-mi)/sp*c.height;i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.strokeStyle='#d9e3e3';ctx.lineWidth=2;ctx.stroke()}
function drawVolume(){const c=E('volChart');if(!c)return;const rows=completed(),ctx=c.getContext('2d');ctx.clearRect(0,0,c.width,c.height);const valid=rows.map(x=>({x,v:volOf(x)})).filter(z=>z.v!=null);if(!valid.length){ctx.fillStyle='#ff7c86';ctx.font='14px system-ui';ctx.fillText('Volume data unavailable',20,30);return}const mx=Math.max(...valid.map(z=>z.v),1),bw=c.width/valid.length;valid.forEach((z,i)=>{const bh=(z.v/mx)*(c.height-6),up=Number(z.x.close)>=Number(z.x.open);ctx.fillStyle=up?'#3ddc97':'#ff7c86';ctx.fillRect(i*bw+1,c.height-bh,Math.max(1,bw-2),bh)})}
function drawRSI(r){const c=E('rsiChart');if(!c)return;const ctx=c.getContext('2d'),y=v=>c.height-(v/100)*c.height;ctx.clearRect(0,0,c.width,c.height);[80,70,30,20].forEach(v=>{ctx.beginPath();ctx.moveTo(0,y(v));ctx.lineTo(c.width,y(v));ctx.strokeStyle='#596468';ctx.stroke()});ctx.beginPath();let started=false;r.forEach((v,i)=>{if(v==null)return;const x=i*c.width/(r.length-1);started?ctx.lineTo(x,y(v)):ctx.moveTo(x,y(v));started=true});ctx.strokeStyle='#e0e6e6';ctx.lineWidth=2;ctx.stroke()}
function analyze(rsis){const volStats=E('volStats'),rsiStats=E('rsiStats'),analysis=E('analysisBox');if(!volStats||!rsiStats||!analysis)return;const closed=completed();const validClosed=closed.filter(x=>volOf(x)!=null);if(closed.length<20){volStats.innerHTML=card('Volume candles',validClosed.length+'/'+closed.length)+card('Recent / Baseline','—')+card('Volume Spike','—');analysis.textContent='داده کافی برای تحلیل نیست';return}const cfg=(tf==='1m'||tf==='5m')?{recent:5,base:30}:(tf==='15m'||tf==='1h')?{recent:3,base:24}:{recent:2,base:20};const recent=closed.slice(-cfg.recent),base=closed.slice(-(cfg.base+cfg.recent),-cfg.recent),rv=avg(recent.map(volOf).filter(x=>x!=null)),bv=avg(base.map(volOf).filter(x=>x!=null)),ratio=bv?rv/bv:null,spike=ratio==null?null:(ratio-1)*100,prev=closed.slice(-(cfg.recent*2),-cfg.recent),pv=avg(prev.map(volOf).filter(x=>x!=null)),trend=pv&&rv!=null?((rv-pv)/pv)*100:null;let sell=0,total=0;for(const x of recent){const v=volOf(x);if(v==null)continue;total+=v;if(Number(x.close)<Number(x.open))sell+=v}const sellShare=total?sell/total*100:null,priceMove=((Number(recent.at(-1).close)-Number(recent[0].open))/Number(recent[0].open))*100;volStats.innerHTML=card('Recent / Baseline',ratio==null?'—':ratio.toFixed(2)+'×')+card('Volume Spike',pct(spike))+card('Volume Trend',pct(trend))+card('Sell-volume share',sellShare==null?'—':sellShare.toFixed(0)+'%')+card('Recent Avg Volume',compact(rv))+card('Baseline Avg Volume',compact(bv));const live=rsis.at(-1),closedIndex=candles.map((x,i)=>x.isClosed===true?i:null).filter(x=>x!=null).at(-1)??Math.max(0,candles.length-2),lastClosed=rsis[closedIndex];rsiStats.innerHTML=card('RSI Live',live==null?'—':live.toFixed(2))+card('RSI Last Closed',lastClosed==null?'—':lastClosed.toFixed(2))+card('TF',tf);const notes=[];if(ratio!=null&&ratio>2)notes.push('حجم بسیار بالا');else if(ratio!=null&&ratio>1.4)notes.push('حجم بالا');if(priceMove>0&&trend!=null&&trend<0)notes.push('واگرایی حجم / ضعف ادامه پامپ');if(priceMove<0&&trend!=null&&trend>0)notes.push('فشار فروش در حال افزایش');if(sellShare!=null&&sellShare>=60)notes.push('غلبه حجم فروش');if(ratio!=null&&ratio>1.4&&Math.abs(priceMove)<0.5)notes.push('احتمال جذب/توزیع');if(live!=null&&live>=80)notes.push('RSI بسیار اشباع خرید');analysis.innerHTML='<b>تحلیل:</b> '+(notes.length?notes.join(' — '):'ادامه روند/خنثی؛ سیگنال واضح توزیع دیده نمی‌شود')+'<br><span class="muted">Price move: '+pct(priceMove)+'</span>'}
function closeModal(){E('modalbg').classList.remove('open');active=''}
init();loadTop();
</script>
</body></html>
